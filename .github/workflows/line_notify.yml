name: LINE Expiry Notification

on:
  # รันอัตโนมัติทุกวันที่ 1 และ 15 ของเดือน เวลา 9:00 น. (Bangkok = 02:00 UTC)
  schedule:
    - cron: '0 2 1,15 * *'

  # เปิดให้กดรันเองได้จากหน้า Actions (ไว้ทดสอบ)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send LINE notification
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          HTML_URL: ${{ secrets.HTML_URL }}
        run: python scripts/notify_line.py
